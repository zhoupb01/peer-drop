<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="两台设备之间传文件和消息，不用登录。">
<title>PeerDrop · 两台设备之间传文件</title>
<style>
  :root {
    --bg: #fafaf9;
    --panel: #ffffff;
    --sunk: #f2f2f0;
    --line: #e6e6e2;
    --line-2: #d2d2cc;
    --tx: #18181b;
    --tx-2: #55555d;
    --tx-3: #8a8a92;
    --ac: #2563eb;
    --ac-soft: #e7effd;
    --on-ac: #ffffff;
    --ok: #16a34a;
    --warn: #d97706;
    --err: #d92d20;
    --err-soft: #fdecea;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0c0e;
      --panel: #141417;
      --sunk: #101013;
      --line: #24242a;
      --line-2: #35353d;
      --tx: #ececf0;
      --tx-2: #a3a3ad;
      --tx-3: #74747e;
      --ac: #5b95ff;
      --ac-soft: #15213a;
      --on-ac: #07101f;
      --ok: #4ade80;
      --warn: #fbbf24;
      --err: #f87171;
      --err-soft: #2b1415;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--tx);
    font: 15px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow-x: clip;
  }
  h1, h2, p { margin: 0; }
  button, input { font: inherit; color: inherit; margin: 0; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }

  .top { height: 56px; display: flex; align-items: center; max-width: 1080px; margin: 0 auto; padding: 0 24px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; letter-spacing: -.01em; }

  .home { max-width: 1080px; margin: 0 auto; padding: 48px 24px 32px; }
  h1 { font-size: clamp(26px, 3.6vw, 38px); line-height: 1.2; letter-spacing: -.025em; font-weight: 650; margin-bottom: 36px; text-wrap: balance; }
  .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; display: flex; flex-direction: column; min-height: 272px; }
  .card h2 { font-size: 18px; font-weight: 620; letter-spacing: -.01em; }
  .card .d { color: var(--tx-2); margin-top: 4px; }
  .card .grow { flex: 1; min-height: 24px; }
  .foot { margin-top: 28px; color: var(--tx-3); font-size: 13px; max-width: 44em; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 20px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel); color: var(--tx); font-weight: 560; white-space: nowrap; }
  .btn:hover { background: var(--sunk); }
  .btn.pri { background: var(--ac); border-color: var(--ac); color: var(--on-ac); }
  .btn.pri:hover { filter: brightness(1.07); }
  .btn.wide { width: 100%; height: 50px; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--tx-2); }
  .btn.sm { height: 44px; padding: 0 14px; font-size: 14px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.copied { border-color: var(--ok); color: var(--ok); }

  .code { display: flex; gap: 10px; }
  .code input { flex: 1; min-width: 0; max-width: 76px; height: 76px; padding: 0; text-align: center; font: 600 36px var(--mono); text-transform: uppercase;
    border: 1px solid var(--line-2); border-radius: 12px; background: var(--bg); color: var(--tx); caret-color: var(--ac); }
  .code input:focus { outline: none; border-color: var(--ac); box-shadow: 0 0 0 4px var(--ac-soft); }
  .code input:disabled { opacity: .6; }
  .code.err input { border-color: var(--err); background: var(--err-soft); }
  .code.shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .emsg { margin-top: 12px; color: var(--err); font-weight: 500; }
  .actions { margin-top: 16px; }

  .card:not(.failed) .fatal { display: none; }
  .card.failed .normal, .card.failed .when-ok { display: none; }
  .fatal .emsg { margin: 0 0 16px; }

  .center { max-width: 520px; margin: 0 auto; padding: 40px 16px 32px; }
  .panel { min-height: 0; padding: 32px; }
  .panel h1 { font-size: 22px; margin-bottom: 20px; letter-spacing: -.015em; }
  .tiles { display: flex; gap: 10px; }
  .tiles span { flex: 1; height: 112px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); font: 600 clamp(48px, 14vw, 72px)/1 var(--mono); }
  .row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .hint { color: var(--tx-2); margin-top: 20px; }
  .status { display: flex; align-items: center; gap: 10px; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--tx-2); }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--ac); flex: none; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .bar-ind { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 8px; position: relative; }
  .bar-ind::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 35%; background: var(--ac); animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }

  .sess { height: 100dvh; display: flex; flex-direction: column; }
  .sbar { flex: none; min-height: 56px; border-bottom: 1px solid var(--line); background: var(--bg); }
  .sbar .in { max-width: 780px; margin: 0 auto; min-height: 56px; padding: 6px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .route { display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; font-weight: 560; min-width: 0; }
  #routeText { white-space: nowrap; }
  .route .note { color: var(--tx-3); font-weight: 400; font-size: 13px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.warn { background: var(--warn); }
  .dot.off { background: var(--tx-3); }
  .feed { flex: 1; min-height: 0; overflow: auto; padding: 20px 16px; }
  .list { max-width: 748px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; min-height: 100%; justify-content: flex-end; }
  .sys { align-self: center; color: var(--tx-3); font-size: 12.5px; padding: 4px 0 8px; }
  .empty { align-self: center; text-align: center; color: var(--tx-2); margin: auto 0; padding: 24px 0; }
  .m { max-width: 78%; padding: 9px 14px; border-radius: 18px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .m.me { align-self: flex-end; background: var(--ac); color: var(--on-ac); border-bottom-right-radius: 6px; }
  .m.peer { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .f { width: min(360px, 88%); display: flex; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
  .f.me { align-self: flex-end; }
  .f.peer { align-self: flex-start; }
  .ext { flex: none; width: 42px; height: 42px; border-radius: 10px; background: var(--sunk); border: 1px solid var(--line); display: grid; place-items: center; font: 600 11px var(--mono); color: var(--tx-2); }
  .fb { flex: 1; min-width: 0; }
  .fn { font-weight: 560; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fm { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--tx-3); margin-top: 1px; font-variant-numeric: tabular-nums; }
  .fm .ok { color: var(--ok); }
  .fm a { color: var(--ac); }
  .prog { height: 4px; border-radius: 2px; background: var(--line); margin-top: 8px; overflow: hidden; }
  .prog i { display: block; height: 100%; width: 0; background: var(--ac); border-radius: 2px; }
  .comp { flex: none; border-top: 1px solid var(--line); background: var(--bg); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .comp form { max-width: 748px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
  .ibtn { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--panel); display: grid; place-items: center; color: var(--tx-2); padding: 0; }
  .ibtn:hover { background: var(--sunk); }
  .ibtn:disabled { opacity: .45; cursor: not-allowed; }
  .comp input { flex: 1; min-width: 0; height: 46px; border-radius: 23px; border: 1px solid var(--line-2); background: var(--panel); padding: 0 18px; color: var(--tx); }
  .comp input:focus { outline: none; border-color: var(--ac); box-shadow: 0 0 0 4px var(--ac-soft); }
  .comp input:disabled { opacity: .6; }
  .comp .btn { border-radius: 23px; height: 46px; }

  .ov { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; text-align: center; padding: 16px; background: color-mix(in srgb, var(--bg) 93%, transparent); }
  .ov.show { display: grid; }
  .ov::before { content: ""; position: absolute; inset: 16px; border: 2px dashed var(--ac); border-radius: 22px; background: var(--ac-soft); opacity: .55; }
  .ov div { position: relative; }
  .ov b { display: block; font-size: 30px; letter-spacing: -.02em; font-weight: 650; }
  .ov span { display: block; color: var(--tx-2); margin-top: 6px; }

  @media (max-width: 760px) {
    .cols { grid-template-columns: minmax(0, 1fr); }
    .top { padding: 0 16px; }
    .home { padding: 28px 16px 24px; }
    .card { padding: 22px; min-height: 0; }
    .card .grow { min-height: 20px; }
    .panel { padding: 24px 20px; }
    .m { max-width: 86%; }
    .code input { height: 68px; font-size: 32px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="plain">
  <header class="top">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="7" cy="11" r="5" fill="none" stroke="var(--tx)" stroke-width="2"/><circle cx="15" cy="11" r="5" fill="var(--ac)"/></svg>
      PeerDrop
    </div>
  </header>

  <main id="home" class="home">
    <h1>两台设备之间传文件和消息，不用登录。</h1>
    <div class="cols">
      <section class="card" id="sendCard">
        <h2>发送</h2>
        <p class="d">生成连接码，告诉对方</p>
        <div class="grow"></div>
        <button class="btn pri wide normal" id="genBtn" onclick="startAsOfferer()">生成连接码</button>
        <div class="fatal"><p class="emsg" aria-live="polite"></p><button class="btn wide" onclick="resetApp()">返回首页</button></div>
      </section>
      <section class="card">
        <h2>接收</h2>
        <p class="d">输入对方给你的 4 位连接码</p>
        <div class="grow"></div>
        <div class="code" id="codeInGroup">
          <input class="code-cell-input" maxlength="1" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="连接码第 1 位">
          <input class="code-cell-input" maxlength="1" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="连接码第 2 位">
          <input class="code-cell-input" maxlength="1" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="连接码第 3 位">
          <input class="code-cell-input" maxlength="1" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="连接码第 4 位">
        </div>
        <p class="emsg" id="recvErr" aria-live="polite" hidden></p>
        <div class="actions">
          <button class="btn wide" id="connectBtn" onclick="connectWithCode()">连接</button>
          <button class="btn wide" id="retryBtn" onclick="retryRecv()" hidden>重新输入</button>
        </div>
      </section>
    </div>
    <p class="foot">文件在两台设备之间直接传输。直连不通时经 Cloudflare 中继，全程端到端加密，服务器看不到内容。</p>
  </main>

  <main id="waiting" class="center" hidden>
    <section class="card panel" id="waitCard">
      <h1>把连接码告诉对方</h1>
      <div class="normal">
        <div class="tiles" id="codeOut"></div>
        <div class="row">
          <button class="btn" id="copyBtn" onclick="copyCode()"><span id="copyLabel">复制</span></button>
          <button class="btn ghost" onclick="resetApp()">取消</button>
        </div>
        <p class="hint">对方打开 drop.zhoupb.com，在「接收」里输入。10 分钟内有效。</p>
        <div class="status"><i class="pulse"></i><span id="waitStatus" aria-live="polite">等待对方加入…</span></div>
      </div>
      <div class="fatal"><p class="emsg" aria-live="polite"></p><button class="btn wide" onclick="resetApp()">返回首页</button></div>
    </section>
  </main>

  <main id="connecting" class="center" hidden>
    <section class="card panel" id="connCard">
      <h1 class="when-ok" aria-live="polite">已找到对方，正在连接…</h1>
      <div class="normal">
        <div class="bar-ind"></div>
        <div class="row"><button class="btn ghost" onclick="resetApp()">取消</button></div>
      </div>
      <div class="fatal"><p class="emsg" aria-live="polite"></p><button class="btn wide" onclick="resetApp()">返回首页</button></div>
    </section>
  </main>
</div>

<div id="session" class="sess" hidden>
  <header class="sbar">
    <div class="in">
      <div class="route" aria-live="polite"><i class="dot" id="dot"></i><span id="routeText">已连接</span><span class="note" id="routeNote" hidden>端到端加密</span></div>
      <button class="btn sm" id="endBtn" onclick="resetApp()">断开</button>
    </div>
  </header>
  <main class="feed" id="feed">
    <div class="list" id="chatLog"><div class="empty" id="emptyHint">发条消息，或把文件拖进来。</div></div>
  </main>
  <div class="comp">
    <form id="composer">
      <button type="button" class="ibtn" id="attachBtn" aria-label="发送文件"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7-7l9-9a3.3 3.3 0 0 1 4.7 4.7l-9 9a1.7 1.7 0 0 1-2.4-2.4l8.3-8.3"/></svg></button>
      <input type="text" id="chatInput" placeholder="输入消息" autocomplete="off" enterkeyhint="send">
      <button class="btn pri" id="sendBtn" type="submit">发送</button>
    </form>
    <input type="file" id="fileInput" hidden multiple>
  </div>
</div>

<!-- 拖拽文件时全窗口提示 -->
<div id="dropOverlay" class="ov"><div><b>松开即可发送</b><span>可以一次发多个文件</span></div></div>

<script>
'use strict';

const CHUNK_SIZE = 16 * 1024;          // 16KB，兼容性最好的 DataChannel 块大小
const BUFFER_HIGH = 4 * 1024 * 1024;   // 发送缓冲高水位 4MB
const BUFFER_LOW  = 1 * 1024 * 1024;   // 低于 1MB 继续发

const SIGNAL = '/api';                                        // 同域 Cloudflare Worker 信令接口

let pc = null;          // RTCPeerConnection
let dc = null;          // RTCDataChannel
let incoming = null;    // 接收中的文件 { meta, chunks, received, card }
let myCode = '';        // 发起方生成的连接码
let connecting = false; // 接收方是否已发起连接，避免重复触发
const sendQueue = [];
let sendingFiles = false;
let sessionStarted = false; // 会话是否已经建立过（会话初始化只做一次）
let sessionEnded = false;   // 会话是否已结束
let route = null;           // { name, relayed }
let screen = 'home';        // home | waiting | connecting | session

const $ = id => document.getElementById(id);

// ───────────────────────── 连接码压缩 ─────────────────────────
// 完整 SDP 里绝大部分是固定模板，真正因人而异的只有 ice-ufrag、ice-pwd、
// DTLS 指纹和候选地址。只传这四样，对端按模板重建，码长从 ~2000 降到 ~150。

function compressSDP(desc) {
  const sdp = desc.sdp;
  const ufrag = sdp.match(/^a=ice-ufrag:(.+)$/m)[1];
  const pwd = sdp.match(/^a=ice-pwd:(.+)$/m)[1];
  const fpHex = sdp.match(/^a=fingerprint:sha-256 (.+)$/mi)[1].trim();
  const fp = btoa(fpHex.split(':').map(h => String.fromCharCode(parseInt(h, 16))).join(''));
  const seen = new Set();
  const cands = [];
  for (const m of sdp.matchAll(/^a=candidate:\S+ \d+ udp \S+ (\S+) (\d+) typ (host|srflx|relay)/gim)) {
    const c = m[3][0] + m[1] + '~' + m[2];   // 形如 h192.168.1.5~54321
    if (!seen.has(c)) { seen.add(c); cands.push(c); }
  }
  return [desc.type === 'offer' ? 'O' : 'A', ufrag, pwd, fp, cands.join(',')].join('|');
}

function expandSDP(code) {
  const [role, ufrag, pwd, fp, candStr] = code.replace(/\s+/g, '').split('|');
  const fpHex = [...atob(fp)].map(ch => ch.charCodeAt(0).toString(16).padStart(2, '0').toUpperCase()).join(':');
  const typeMap = { h: 'host', s: 'srflx', r: 'relay' };
  const lines = [
    'v=0', 'o=- 0 0 IN IP4 127.0.0.1', 's=-', 't=0 0',
    'a=group:BUNDLE 0',
    'm=application 9 UDP/DTLS/SCTP webrtc-datachannel',
    'c=IN IP4 0.0.0.0',
    'a=ice-ufrag:' + ufrag,
    'a=ice-pwd:' + pwd,
    'a=fingerprint:sha-256 ' + fpHex,
    'a=setup:' + (role === 'O' ? 'actpass' : 'active'),
    'a=mid:0',
    'a=sctp-port:5000',
  ];
  candStr.split(',').forEach((c, i) => {
    const typ = typeMap[c[0]];
    const [addr, port] = c.slice(1).split('~');
    lines.push(`a=candidate:${i} 1 udp ${(126 - i) * 16777216} ${addr} ${port} typ ${typ}` +
      (typ === 'host' ? '' : ' raddr 0.0.0.0 rport 0'));
  });
  lines.push('a=end-of-candidates', '');
  return { type: role === 'O' ? 'offer' : 'answer', sdp: lines.join('\r\n') };
}

// ───────────────────────── 连接建立 ─────────────────────────

async function createPeer(code) {
  // 国内 + 国外 STUN 各备一路：挂代理时国外 STUN 拿到的是代理出口 IP（打不通洞），
  // 国内 STUN 通常命中代理的 DIRECT 规则，能拿到真实公网出口。
  // Google STUN 有 AAAA 记录，双栈环境能取到 IPv6 srflx，双方都有 IPv6 时免 NAT 直连
  const iceServers = [
    { urls: ['stun:stun.cloudflare.com:3478', 'stun:stun.cloudflare.com:53'] },
    { urls: 'stun:stun.miwifi.com:3478' },
    { urls: 'stun:stun.qq.com:3478' },
    { urls: 'stun:stun.l.google.com:19302' },
  ];
  // TURN 时效凭据由信令服务签发。TUN 代理等场景打不了洞时，ICE 自动降级走中继
  const turn = await fetch(`${SIGNAL}/room/${code}/turn`).then(r => r.ok ? r.json() : null).catch(() => null);
  if (turn?.urls?.length) iceServers.push(turn);

  pc = new RTCPeerConnection({ iceServers });
  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if (s === 'connected') {
      if (sessionStarted) showConnectedBar(); else onConnected();
    } else if (s === 'disconnected') {
      if (sessionStarted && !sessionEnded) setBar('连接中断，正在重试…', 'warn', false);
    } else if (s === 'failed' || s === 'closed') {
      if (sessionStarted) endSession();
      else if (s === 'failed') showFatal('连接失败。网络可能拦截了 UDP、TCP 和 TLS，换个网络试试。');
    }
  };
}

// 等待 ICE 候选全部收集完，这样 SDP 里带上所有地址，一次复制粘贴就够
function waitIceComplete() {
  return new Promise(resolve => {
    if (pc.iceGatheringState === 'complete') return resolve();
    pc.addEventListener('icegatheringstatechange', function h() {
      if (pc.iceGatheringState === 'complete') {
        pc.removeEventListener('icegatheringstatechange', h);
        resolve();
      }
    });
    setTimeout(resolve, 5000); // 兜底：5 秒后有多少算多少
  });
}

// ───────────────────────── 信令交换（Worker 中转，只传握手信息） ─────────────────────────

const roomUrl = (code, slot) => `${SIGNAL}/room/${code}/${slot}`;

function signalError(status) {
  return Object.assign(new Error('signal ' + status), { status });
}

async function signalPut(code, slot, value) {
  const r = await fetch(roomUrl(code, slot), { method: 'POST', body: value });
  if (!r.ok) throw signalError(r.status);
}

async function signalGet(code, slot) {
  const r = await fetch(roomUrl(code, slot));
  if (r.status === 200) return r.text();
  if (r.status === 404) return null;
  throw signalError(r.status);
}

async function startAsOfferer() {
  $('genBtn').disabled = true;
  $('genBtn').textContent = '正在生成…';
  let code;
  try {
    const r = await fetch(`${SIGNAL}/room`, { method: 'POST' });
    if (!r.ok) throw signalError(r.status);
    code = await r.text();
  } catch { return showFatal('服务器暂时连不上，稍后再试。'); }
  await createPeer(code);
  dc = pc.createDataChannel('main');
  setupChannel(dc);

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await waitIceComplete();

  try { await signalPut(code, 'offer', compressSDP(pc.localDescription)); }
  catch { return showFatal('服务器暂时连不上，稍后再试。'); }

  myCode = code;
  renderCode(code);
  show('waiting');

  // 轮询应答，最多等 10 分钟（与房间 TTL 一致）
  for (let i = 0; i < 400; i++) {
    await new Promise(r => setTimeout(r, 1500));
    if (pc.remoteDescription) return;   // 应答已设置，交给状态机
    const answer = await signalGet(code, 'answer').catch(() => null);
    if (answer) {
      await pc.setRemoteDescription(expandSDP(answer));
      $('waitStatus').textContent = '对方已加入，正在连接…';
      return;
    }
  }
  showFatal('连接码已过期，回到首页重新生成。');
}

async function connectWithCode() {
  if (connecting) return;
  const code = getInputCode();
  if (code.length !== 4) { shakeCode(); codeCells[code.length]?.focus(); return; }

  connecting = true;
  setInputsDisabled(true);
  let offerCode;
  try { offerCode = await signalGet(code, 'offer'); }
  catch {
    connecting = false;
    return recvError('服务器暂时连不上，稍后再试。');
  }
  if (!offerCode) {
    connecting = false;
    shakeCode();
    return recvError('没找到这个连接码。检查一下，或让对方重新生成。');
  }

  show('connecting');
  await createPeer(code);
  pc.ondatachannel = e => { dc = e.channel; setupChannel(dc); };

  await pc.setRemoteDescription(expandSDP(offerCode));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  await waitIceComplete();

  try { await signalPut(code, 'answer', compressSDP(pc.localDescription)); }
  catch (error) {
    return recvError(error.status === 409
      ? '这个连接码已被别人使用，请让对方重新生成。'
      : '服务器暂时连不上，稍后再试。');
  }
}

function onConnected() {
  sessionStarted = true;
  show('session');
  showConnectedBar();
  $('chatInput').focus();
  // 显示实际连接路径：局域网直连 / 公网直连 / Cloudflare 中继
  pc.getStats().then(stats => {
    stats.forEach(r => {
      if (route || r.type !== 'candidate-pair' || r.state !== 'succeeded' || !r.nominated) return;
      const local = stats.get(r.localCandidateId);
      if (!local) return;
      const remote = stats.get(r.remoteCandidateId);
      // 浏览器可能因 mDNS 隐私保护隐藏 host 候选地址，空地址按局域网处理
      const addr = local.address || '';
      const isLan = !addr || /^(10\.|172\.(1[6-9]|2\d|3[01])\.|192\.168\.|169\.254\.|f[cde])/i.test(addr) || addr.endsWith('.local');
      const relayed = local.candidateType === 'relay' || remote?.candidateType === 'relay';
      const name =
        relayed ? '经 Cloudflare 中继' :
        local.candidateType !== 'host' ? '公网直连' :
        isLan ? '局域网直连' : '公网直连';
      route = { name, relayed };
      logSys(relayed ? `${name} · 端到端加密` : name);
      if (!sessionEnded) showConnectedBar();
    });
  }).catch(() => {});
}

// ───────────────────────── DataChannel ─────────────────────────

function setupChannel(channel) {
  channel.binaryType = 'arraybuffer';
  channel.bufferedAmountLowThreshold = BUFFER_LOW;
  channel.onmessage = e => {
    if (typeof e.data === 'string') {
      const msg = JSON.parse(e.data);
      if (msg.type === 'chat') addMsg(msg.text, 'peer');
      else if (msg.type === 'file-meta') beginReceiveFile(msg);
      else if (msg.type === 'file-end') finishReceiveFile();
    } else {
      receiveChunk(e.data);
    }
  };
  channel.onclose = () => { if (sessionStarted) endSession(); };
}

// ───────────────────────── 聊天 ─────────────────────────

function sendChat() {
  const input = $('chatInput');
  const text = input.value.trim();
  if (!text || !dc || dc.readyState !== 'open') return;
  dc.send(JSON.stringify({ type: 'chat', text }));
  addMsg(text, 'me');
  input.value = '';
}

// ───────────────────────── 文件发送 ─────────────────────────

function queueFiles(files) {
  if (!dc || dc.readyState !== 'open') return;
  sendQueue.push(...files);
  processSendQueue();
}

async function processSendQueue() {
  if (sendingFiles) return;
  sendingFiles = true;
  try {
    while (sendQueue.length) await sendFile(sendQueue.shift());
  } finally {
    sendingFiles = false;
  }
}

async function sendFile(file) {
  if (!file || !dc || dc.readyState !== 'open') return;
  dc.send(JSON.stringify({ type: 'file-meta', name: file.name, size: file.size }));

  const card = addFileCard(file.name, file.size, 'me');
  let offset = 0;

  while (offset < file.size) {
    // 背压控制：缓冲区太满就等 bufferedamountlow 事件
    if (dc.bufferedAmount > BUFFER_HIGH) {
      await new Promise(res => dc.addEventListener('bufferedamountlow', res, { once: true }));
    }
    const chunk = await file.slice(offset, offset + CHUNK_SIZE).arrayBuffer();
    dc.send(chunk);
    offset += chunk.byteLength;
    card.set(offset);
  }
  dc.send(JSON.stringify({ type: 'file-end' }));
  card.done();
}

// ───────────────────────── 文件接收 ─────────────────────────

function beginReceiveFile(meta) {
  incoming = {
    meta,
    chunks: [],
    received: 0,
    card: addFileCard(meta.name, meta.size, 'peer')
  };
}

function receiveChunk(buf) {
  if (!incoming) return;
  incoming.chunks.push(buf);
  incoming.received += buf.byteLength;
  incoming.card.set(incoming.received);
}

function finishReceiveFile() {
  if (!incoming) return;
  const blob = new Blob(incoming.chunks);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = incoming.meta.name;
  a.textContent = '保存';
  incoming.card.done(a);
  incoming = null;
}

// ───────────────────────── UI ─────────────────────────

const SCREEN_CARD = { home: 'sendCard', waiting: 'waitCard', connecting: 'connCard' };

function show(name) {
  screen = name;
  $('plain').hidden = name === 'session';
  for (const id of ['home', 'waiting', 'connecting', 'session']) $(id).hidden = id !== name;
  window.scrollTo(0, 0);
}

// 连接建立前的致命错误：显示在当前屏幕的卡片里，附「返回首页」
function showFatal(text) {
  const card = $(SCREEN_CARD[screen]);
  card.querySelector('.fatal .emsg').textContent = text;
  card.classList.add('failed');
}

// 接收方错误：回到首页，显示在输入框下面
function recvError(text) {
  show('home');
  $('codeInGroup').classList.add('err');
  $('recvErr').textContent = text;
  $('recvErr').hidden = false;
  $('connectBtn').hidden = true;
  $('retryBtn').hidden = false;
}

function retryRecv() {
  if (pc) { pc.close(); pc = null; }
  connecting = false;
  codeCells.forEach(c => { c.value = ''; });
  setInputsDisabled(false);
  $('codeInGroup').classList.remove('err');
  $('recvErr').hidden = true;
  $('retryBtn').hidden = true;
  $('connectBtn').hidden = false;
  codeCells[0].focus();
}

function setBar(text, cls, note) {
  $('routeText').textContent = text;
  $('dot').className = 'dot' + (cls ? ' ' + cls : '');
  $('routeNote').hidden = !note;
}

function showConnectedBar() {
  setBar(route ? '已连接 · ' + route.name : '已连接', '', route?.relayed);
}

function endSession() {
  if (sessionEnded) return;
  sessionEnded = true;
  setBar('已断开', 'off', false);
  logSys('连接已断开');
  $('endBtn').textContent = '返回首页';
  $('chatInput').disabled = true;
  $('sendBtn').disabled = true;
  $('attachBtn').disabled = true;
}

function addMsg(text, who) {
  const div = document.createElement('div');
  div.className = 'm ' + who;
  div.textContent = text;
  appendLog(div);
}

function logSys(text) {
  const div = document.createElement('div');
  div.className = 'sys';
  div.textContent = text;
  appendLog(div);
}

function fileExt(name) {
  const i = name.lastIndexOf('.');
  return i > 0 && i < name.length - 1 ? name.slice(i + 1, i + 5).toUpperCase() : 'FILE';
}

function addFileCard(name, size, who) {
  const div = document.createElement('div');
  div.className = 'f ' + who;

  const ext = document.createElement('div');
  ext.className = 'ext';
  ext.textContent = fileExt(name);

  const body = document.createElement('div');
  body.className = 'fb';
  const title = document.createElement('div');
  title.className = 'fn';
  title.textContent = name;
  const meta = document.createElement('div');
  meta.className = 'fm';
  const left = document.createElement('span');
  const right = document.createElement('span');
  meta.append(left, right);
  const progress = document.createElement('div');
  progress.className = 'prog';
  const bar = document.createElement('i');
  progress.appendChild(bar);

  body.append(title, meta, progress);
  div.append(ext, body);
  appendLog(div);

  const card = {
    set(done) {
      const pct = size ? Math.floor(done / size * 100) : 100;
      left.textContent = `${fmtSize(done)} / ${fmtSize(size)}`;
      right.textContent = `${who === 'me' ? '发送中' : '接收中'} · ${pct}%`;
      bar.style.width = (size ? done / size * 100 : 100) + '%';
    },
    done(link) {
      left.textContent = fmtSize(size);
      right.textContent = who === 'me' ? '已发送' : '已接收';
      right.classList.add('ok');
      if (link) right.append(' · ', link);
      progress.remove();
    }
  };
  card.set(0);
  return card;
}

function appendLog(el) {
  const log = $('chatLog');
  if (!el.classList.contains('sys')) $('emptyHint')?.remove();
  log.insertBefore(el, $('emptyHint'));
  $('feed').scrollTop = $('feed').scrollHeight;
}

function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
  return (n / 1073741824).toFixed(2) + ' GB';
}

// ── 连接码 UI ──

function renderCode(str) {
  const out = $('codeOut');
  out.innerHTML = '';
  for (const ch of str.split('')) {
    const cell = document.createElement('span');
    cell.textContent = ch;
    out.appendChild(cell);
  }
}

function copyCode() {
  if (!myCode) return;
  navigator.clipboard.writeText(myCode).then(() => {
    const btn = $('copyBtn');
    btn.classList.add('copied');
    $('copyLabel').textContent = '已复制';
    setTimeout(() => { btn.classList.remove('copied'); $('copyLabel').textContent = '复制'; }, 1600);
  }).catch(() => {});
}

const codeCells = [...document.querySelectorAll('.code-cell-input')];

function getInputCode() {
  return codeCells.map(c => c.value).join('').toUpperCase();
}

function setInputsDisabled(disabled) {
  codeCells.forEach(c => { c.disabled = disabled; });
  $('connectBtn').disabled = disabled;
  $('connectBtn').textContent = disabled ? '正在查找…' : '连接';
}

function shakeCode() {
  const group = $('codeInGroup');
  group.classList.remove('shake');
  void group.offsetWidth;   // 触发重排以重启动画
  group.classList.add('shake');
}

codeCells.forEach((cell, i) => {
  cell.addEventListener('input', () => {
    cell.value = cell.value.toUpperCase().replace(/[^A-Z2-9]/g, '').slice(0, 1);
    if (cell.value && i < codeCells.length - 1) codeCells[i + 1].focus();
    if (codeCells.every(c => c.value)) connectWithCode();
  });
  cell.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !cell.value && i > 0) codeCells[i - 1].focus();
    else if (e.key === 'ArrowLeft' && i > 0) codeCells[i - 1].focus();
    else if (e.key === 'ArrowRight' && i < codeCells.length - 1) codeCells[i + 1].focus();
    else if (e.key === 'Enter') connectWithCode();
  });
  cell.addEventListener('paste', e => {
    e.preventDefault();
    const chars = (e.clipboardData.getData('text') || '').toUpperCase().replace(/[^A-Z2-9]/g, '').slice(0, 4).split('');
    chars.forEach((ch, j) => { if (codeCells[j]) codeCells[j].value = ch; });
    codeCells[Math.min(chars.length, codeCells.length - 1)].focus();
    if (codeCells.every(c => c.value)) connectWithCode();
  });
});

function resetApp() {
  location.reload();
}
// ── 文件选择 / 拖拽 ──

const fileInput = $('fileInput');

$('attachBtn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  queueFiles(fileInput.files);
  fileInput.value = '';
});

$('composer').addEventListener('submit', e => { e.preventDefault(); sendChat(); });

// 全窗口拖拽：文件拖到页面任意位置都能发送。用计数器抵消子元素反复触发的 enter/leave。
let dragDepth = 0;
const draggingFiles = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');

window.addEventListener('dragenter', e => {
  if (!draggingFiles(e)) return;
  e.preventDefault();
  dragDepth++;
  if (dc && dc.readyState === 'open') $('dropOverlay').classList.add('show');
});
window.addEventListener('dragover', e => {
  if (draggingFiles(e)) e.preventDefault();   // 阻止浏览器把文件当页面打开
});
window.addEventListener('dragleave', e => {
  if (!draggingFiles(e)) return;
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) $('dropOverlay').classList.remove('show');
});
window.addEventListener('drop', e => {
  if (!draggingFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  $('dropOverlay').classList.remove('show');
  if (dc && dc.readyState === 'open' && e.dataTransfer.files.length) queueFiles(e.dataTransfer.files);
});
</script>
</body>
</html>
